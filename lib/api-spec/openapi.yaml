openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /actions/{name}:
    post:
      operationId: invokeServerAction
      tags: [actions]
      summary: Invoke an imported server action
      description: |
        Calls a server action by its exported name. The args array contains its
        original positional arguments. See artifacts/api-server/PORTING.md for
        the supported names, authorization behavior, and file encoding.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionRequest"
      responses:
        "200":
          description: Action result or redirect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
        "400":
          description: Invalid action payload
        "404":
          description: Unknown action
        "500":
          description: Action failed
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ActionRequest:
      type: object
      properties:
        args:
          type: array
          maxItems: 8
          items: {}
        arguments:
          type: array
          maxItems: 8
          items: {}
      oneOf:
        - required: [args]
        - required: [arguments]
    ActionResponse:
      type: object
      properties:
        result: {}
        redirect:
          type: string

